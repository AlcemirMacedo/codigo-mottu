<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<meta name="robots" content="index,follow">
<meta name="theme-color" content="#00C853">

<style>
:root{
--green:#00C853;
--green-dark:#009245;
--white:#ffffff;
--shadow:0 20px 60px rgba(0,0,0,.20);
}

*{
margin:0;
padding:0;
box-sizing:border-box;
-webkit-tap-highlight-color:transparent;
}

html{
height:100%;
}

body{
height:100%;
overflow:hidden;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
background:linear-gradient(135deg,var(--green),var(--green-dark));
color:var(--white);
}

main{
height:100vh;
height:100dvh;
display:flex;
align-items:center;
justify-content:center;
padding:20px;
}

.container{
width:100%;
max-width:480px;
text-align:center;
}

.badge{
display:inline-block;
background:rgba(255,255,255,.16);
backdrop-filter:blur(8px);
padding:10px 18px;
border-radius:999px;
font-size:14px;
font-weight:700;
margin-bottom:22px;
}

h1{
font-size:clamp(2rem,8vw,3.2rem);
line-height:1.1;
font-weight:900;
margin-bottom:16px;
}

.subtitle{
font-size:1.05rem;
line-height:1.5;
opacity:.95;
margin-bottom:28px;
}

.card{
background:#fff;
color:#111;
border-radius:28px;
padding:28px 22px;
box-shadow:var(--shadow);
}

.label{
font-size:13px;
color:#666;
font-weight:700;
letter-spacing:1px;
margin-bottom:10px;
}

.code{
color:var(--green);
font-size:clamp(3rem,14vw,4.5rem);
font-weight:900;
letter-spacing:5px;
line-height:1;
margin-bottom:24px;
user-select:all;
}

button{
width:100%;
border:none;
border-radius:18px;
background:var(--green);
color:#fff;
font-size:1.15rem;
font-weight:800;
padding:18px;
cursor:pointer;
}

button:active{
transform:scale(0.98);
}

.status{
min-height:26px;
margin-top:16px;
font-size:15px;
font-weight:700;
}

.helper{
margin-top:16px;
color:#777;
font-size:14px;
line-height:1.5;
}

footer{
position:fixed;
bottom:12px;
left:0;
width:100%;
text-align:center;
font-size:12px;
opacity:.8;
}

@media (max-height:700px){

.badge{
margin-bottom:14px;
}

h1{
font-size:1.9rem;
margin-bottom:10px;
}

.subtitle{
margin-bottom:18px;
font-size:.95rem;
}

.card{
padding:22px 18px;
}

.code{

}
}
</style>
</head>
<body>

<main>

<div class="container">

<div class="badge">
🎁 CUPOM DE DESCONTO MOTTU
</div>

<h1>
Parabéns!<br>
Você ganhou<br>
R$100 de desconto
</h1>

<p class="subtitle">
Copie o código abaixo e cole no aplicativo da Mottu.
</p>

<section class="card">

<div class="label">
CÓDIGO PROMOCIONAL
</div>

<div
class="code"
id="couponCode"
aria-label="Código promocional 3538697">
3538697
</div>

<button
type="button"
aria-label="Copiar código promocional"
onclick="copyCoupon()">
COPIAR CÓDIGO
</button>

<div
id="status"
class="status"
aria-live="polite">
</div>

<div class="helper">
Abra o aplicativo da Mottu e cole o código durante o cadastro.
</div>

</section>

</div>

</main>

<footer>
Código promocional Mottu • 3538697
</footer>

<script>
async function copyCoupon() {

const code = "3538697";
const status = document.getElementById("status");

try {

await navigator.clipboard.writeText(code);

status.textContent =
"✅ Código copiado com sucesso!";

if (navigator.vibrate) {
navigator.vibrate(100);
}

} catch (error) {

const textArea = document.createElement("textarea");

textArea.value = code;
document.body.appendChild(textArea);

textArea.select();
document.execCommand("copy");

document.body.removeChild(textArea);

status.textContent =
"✅ Código copiado!";
}
}
</script>

</body>
</html>
